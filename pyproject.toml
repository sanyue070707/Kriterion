[project]
name = "kriterion"
version = "0.1.0"
description = "Multi-agent product selection decision system for cross-border e-commerce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pymilvus>=2.4.9",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2.56",
    "langchain>=0.3.14",
    "langchain-core>=0.3.28",
    "langchain-community>=0.3.14",
    "langchain-openai>=0.3.0",
    "sentence-transformers>=3.3.1",
    "faker>=33.0.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.2.1",
    "numpy>=2.1.0",
    "orjson>=3.10.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
