[project]
name = "kriterion"
version = "0.1.0"
description = "Multi-agent product selection decision system for cross-border e-commerce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "langgraph>=0.2.56",
    "langchain-core>=0.3.28",
]

[project.optional-dependencies]
# Optional seam: wire a real chat model in and switch `llm_provider` to "real".
real-llm = ["langchain-openai>=0.3.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
kriterion = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N817: `EvidenceDimension as ED` keeps the scoring map readable.
# N818: SkipStep is a control-flow signal between plan steps, not an error.
ignore = ["N817", "N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
